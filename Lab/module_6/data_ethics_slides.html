## What is Data Ethics?

&lt;div class="original-definition"&gt;&amp;quot;In the simplest terms, &lt;strong&gt;data&lt;/strong&gt; refer to factual information, such as measurements or statistics, used as a basis for reasoning, discussion, or calculation. &lt;strong&gt;Data Ethics &lt;/strong&gt;are the norms of behavior that &lt;u&gt;promote appropriate judgments and accountability when acquiring, managing, or using data&lt;/u&gt;, with the goals of &lt;u&gt;protecting civil liberties, minimizing risks to individuals and society, and maximizing the public good.&lt;/u&gt;&amp;quot; (Federal Data Strategy, 2020)&lt;/div&gt;

.citation[[https://resources.data.gov/assets/documents/fds-data-ethics-framework.pdf](https://resources.data.gov/assets/documents/fds-data-ethics-framework.pdf)]

## What is Data Ethics?

&lt;div class="original-definition"&gt;&amp;quot;In the simplest terms, &lt;strong&gt;data&lt;/strong&gt; refer to factual information, such as measurements or statistics, used as a basis for reasoning, discussion, or calculation. &lt;strong&gt;Data Ethics &lt;/strong&gt;are the norms of behavior that &lt;u&gt;promote appropriate judgments and accountability when acquiring, managing, or using data&lt;/u&gt;, with the goals of &lt;u&gt;protecting civil liberties, minimizing risks to individuals and society, and maximizing the public good.&lt;/u&gt;&amp;quot; (Federal Data Strategy, 2020)&lt;/div&gt;

.citation[[https://resources.data.gov/assets/documents/fds-data-ethics-framework.pdf](https://resources.data.gov/assets/documents/fds-data-ethics-framework.pdf)]

&lt;div class="original-hand"&gt;&amp;quot;...more recently, recognition of the need for such ethical oversight has grown, mainly because of raised awareness of the &lt;strong&gt;potential and pervasiveness of big data, data science, and artificial intelligence&lt;/strong&gt;. Attention has shifted, from rather specialised concerns for informed consent in clinical trials, the preservation of anonymity in survey work, avoiding prohibited variables in insurance decisions, and so on, to much more &amp;quot;in-your-face&amp;quot; issues. These are matters such as selection bias leading to racist decisions, chatbots being gratuitously offensive, and questions of who is responsible when a driverless car crashes or data theft leads to fraud.&amp;quot; (Hand, 2018)&lt;/div&gt;

.citation[[https://imstat.org/2018/12/14/hand-writing-right-legitimate-and-proper-the-new-world-of-data-ethics/](https://imstat.org/2018/12/14/hand-writing-right-legitimate-and-proper-the-new-world-of-data-ethics/)]

class: original-pii

## Personally Identifiable Information (PII)

According to US Department of Labor,

* *PII is defined as any representation of information that permits the identity of an individual to whom the information applies to be reasonably inferred by either direct or indirect means.*

--
  
  
* PII is information:

  - that **directly identifies** an individual (e.g., name, address, social security number or other identifying number or code, telephone number, email address, etc.) or

  - by which an agency intends to identify specific individuals in conjunction with other data elements, i.e., **indirect identification**. (These data elements may include a combination of gender, race, birth date, geographic indicator, and other descriptors).

* Additionally, information permitting the physical or online contacting of a specific individual is the same as personally identifiable information. This information can be maintained in either paper, electronic or other media.

.citation[[https://www.dol.gov/general/ppii](https://www.dol.gov/general/ppii)]

# Discussions



---

## Scenario: Publishing Household Travel Survey Data

You are a city planner in charge of conducting a household travel survey to collect data on transportation patterns in your city. After gathering valuable insights, you want to publish the data publicly to support urban planning and policy-making. However, the data includes sensitive information, such as travel routes, GPS coordinates, and sociodemographic details, which could pose privacy risks if exposed.

- What types of data could lead to ethical issues if made public?
- What strategies would you use to secure the data and ensure its ethical use?
--

## Handling Geolocation Data Ethically

.pull-left[
- Aggregation
- Respect for sensitive locations
- Adjusting spatial/temporal resolution
- Adding noise (perturbation)

**A Key Consideration:**

A delicate balance between leveraging its value for social well-being while protecting individuals' privacy.
]

## Best Practices

- Conduct an ethical review before starting projects.
- Consider the broader impact and unintended consequences.
- Ensure participants know exactly what data is being collected and why.
- Anonymize and aggregate data.
- Communicate data practices transparently with stakeholders.
