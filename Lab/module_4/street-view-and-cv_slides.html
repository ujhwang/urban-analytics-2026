## Module 4 in a Nutshell

1. ~~Get a Google API key.~~
2. Download street-network data from OpenStreetMap and clean it.
3. Generate points along the edges where Google Street View (GSV) images will be downloaded.
4. Calculate the heading for each point.
5. Create a function that takes a point as input and downloads GSV images.
6. Apply a computer-vision model to the images.
7. Merge the results back to the points from Step 3 for analysis.

## GSV API Query Format

&lt;div class="api-url"&gt;&lt;span style="color:#0072c6;"&gt;https://maps.googleapis.com/maps/api/streetview?&lt;/span&gt;&lt;br&gt;&lt;span style="color:#f00000;"&gt;size=640x640&lt;/span&gt;&lt;span style="color:#111;"&gt;&amp;amp;&lt;/span&gt;&lt;span style="color:#003cff;"&gt;location=47.5763831,-122.4211769&lt;/span&gt;&lt;br&gt;&lt;span style="color:#111;"&gt;&amp;amp;&lt;/span&gt;&lt;span style="color:#7a3db8;"&gt;fov=90&lt;/span&gt;&lt;span style="color:#111;"&gt;&amp;amp;&lt;/span&gt;&lt;span style="color:#f0a000;"&gt;heading=70&lt;/span&gt;&lt;span style="color:#111;"&gt;&amp;amp;&lt;/span&gt;&lt;span style="color:#0072c6;"&gt;pitch=0&lt;/span&gt;&lt;span style="color:#111;"&gt;&amp;amp;&lt;/span&gt;&lt;span style="color:#008000;"&gt;key=YOUR_API_KEY&lt;/span&gt;&lt;/div&gt;

.dense[
- `size`: image dimensions
- `location`: latitude and longitude
- `fov`: field of view; default is `90`
- `heading`: camera direction (`0` = north, `90` = east, `180` = south, `270` = west)
- `pitch`: vertical camera angle; default is `0`
- `key`: your API key
]

## Image Segmentation

- Segmentation models detect **things** and/or **stuff** in an image.
  - **Things:** countable objects, such as a person, bicycle, or car
  - **Stuff:** uncountable regions with a consistent texture, such as sky or road

&lt;img class="compact-img" src="img/stuff_things.png" alt="Street image segmented into things and stuff"&gt;

---

## Image Segmentation

- **Semantic segmentation:** Classifies each pixel into a class (*stuff*).
- **Instance segmentation:** Detects objects and distinguishes individual instances (*things*).
- **Panoptic segmentation:** Combines semantic and instance segmentation (*stuff + things*).

&lt;img class="compact-img" src="img/segmentation_types.png" alt="Comparison of semantic, instance, and panoptic segmentation"&gt;
