## Regression Model Result

.pull-left[
&lt;img class="regression-plot-img" src="img/bike_lane_regression_plot.png" alt="Modeled associations between visual-safety scores, bike-lane type, and cycling"&gt;
]

.pull-right[
### Findings

- Both types of bike lanes are **associated with more cycling**.
- The association between striped bike lanes and cycling is stronger on streets perceived as safer, suggesting a synergistic relationship between striped bike lanes and visual safety.
- The association between protected bike lanes and cycling is stronger on streets perceived as less safe, suggesting that protected bike lanes may be especially valuable in these locations.
]

## More Resources

.pull-left[
### Imagery and Datasets

- [Mapillary Training Datasets](https://ai.meta.com/ai-for-good/datasets/mapillary-training-datasets/)  
  Street-level datasets for segmentation, depth, traffic signs, and place recognition.

- [Cityscapes](https://www.cityscapes-dataset.com/dataset-overview/)  
  Urban imagery for semantic, instance, and panoptic segmentation.

- [Place Pulse](https://www.media.mit.edu/projects/place-pulse-1/overview/)  
  Crowdsourced data on perceptions of streets and places.
]

.pull-right[
### Models and Tutorials

- [PyTorch Transfer Learning Tutorial](https://docs.pytorch.org/tutorials/beginner/transfer_learning_tutorial.html)  
  Adapt a pretrained image-classification model to a new task.

- [TorchVision Object Detection Tutorial](https://docs.pytorch.org/tutorials/intermediate/torchvision_tutorial.html)  
  Fine-tune Mask R-CNN for detection and instance segmentation.

- [Segment Anything](https://ai.meta.com/research/sam3/)  
  Explore promptable detection and segmentation.
]
