# From Movement to Access

---

## Components of Urban Transportation Systems

.pull-left[
### Mode
Type of transport used for moving people or goods.

### Network
A system of linked locations that represent the functional and spatial organization of transportation.
]

.pull-right[
### Infrastructure
Physical facilities and structures that enable movement.

### Flow
Movements of people, vehicles, or goods along their respective networks over time.
]

---

## Mobility vs. Accessibility

&lt;img src="img/transportation/image7.jpeg" width="307" class="slide-img" style="display: block; margin: auto;" /&gt;

---

## Mobility vs. Accessibility

.pull-left[
### Mobility

The ease or ability to move: how fast, efficiently, and freely people or goods can travel through a system.
]

.pull-right[
### Accessibility

The ease of reaching desired destinations: how well people can connect to opportunities like jobs, schools, shops, and services.
]

---

---

## Mobility vs. Accessibility

.pull-left[
### Mobility

The ease or ability to move: how fast, efficiently, and freely people or goods can travel through a system.

**Focus:** movement itself, such as speed, flow, and travel time.
]

.pull-right[
### Accessibility

The ease of reaching desired destinations: how well people can connect to opportunities like jobs, schools, shops, and services.

**Focus:** opportunities that can be reached within a given time or cost.
]


.question[
Which concept is more useful if the policy goal is improving access to jobs?
]

---

## Accessibility Matters


.center[
**Accessibility is a function of land use and transportation.**
]

--

.pull-left[
### Land use: where things are

Land use determines the **location**, **density**, and **type** of opportunities.
]

.pull-right[
### Transportation: how we connect them

The transportation system defines the **ease of travel** between origins and destinations.
]

.takeaway[
Improving accessibility can come from transportation investments, land use changes, or both.
]

# Experiencing Travel

---

## Value of Travel Time

Travel time is not just a number of minutes. It is a cost that people weigh against money, comfort, reliability, and access to opportunities.

.pull-left[
### Core idea

People may be willing to pay to save travel time, avoid delay, or make trips more predictable.
]

.pull-right[
### Why it matters

Transportation projects often estimate benefits by asking how much time is saved and whose time is saved.
]

.takeaway[
Value of travel time connects mobility improvements to accessibility, welfare, and benefit-cost analysis.
]

---

## What Shapes the Value of Time?

.pull-left[
### Traveler and trip factors

- Trip purpose
- Income and wages
- Schedule flexibility
- Urgency and constraints
]

.pull-right[
### System and mode factors

- Reliability
- Comfort and crowding
- Ability to use travel time productively
- Availability of alternatives
]

.question[
Is a 10-minute time saving equally valuable for every traveler and every trip?
]

---

## Reliability 

Average travel time does not fully describe how people experience transportation systems.

.pull-left[
### Mean travel time

Typical duration of a trip under normal conditions.
]

.pull-right[
### Reliability

How predictable travel time is from day to day or trip to trip.
]

.takeaway[
Unreliable travel time creates planning costs: people leave earlier, build in buffers, miss connections, or avoid trips.
]

---

## Captive vs. Choice Users

People may use the same transportation mode but have very different alternatives.

.pull-left[
### Captive users

Rely on a mode because practical alternatives are limited.

**Example:** Someone bikes to work because driving is unaffordable and transit is unavailable.
]

.pull-right[
### Choice users

Use a mode while having other practical options.

**Example:** Someone bikes to work but could also drive or take transit.
]

--

.takeaway[
Poor service, unsafe infrastructure, or rising costs can create greater hardship for people with fewer alternatives. Choices vary by trip and circumstances.
]

.question[
If both people use the same bike lane, does that mean they have the same transportation needs?
]

## Privacy and Bias in Transportation Data

Large-scale movement data can make travel patterns visible, but it does not represent everyone equally.

.pull-left[
### Privacy concerns

- Location traces can be sensitive
- Re-identification risk can remain after aggregation
- Data access is often controlled by vendors
]

.pull-right[
### Bias concerns

- Smartphone and app users are not a random sample
- Coverage varies by place, mode, and population
- Vendor processing methods may be opaque
]

.takeaway[
Good transportation analysis asks not only what the data shows, but who is missing and what cannot be observed.
]

---

## Summary: Transportation Data Sources

.data-table[
| Source | Unit of observation | Common uses | Watch for |
|---|---|---|---|
| GTFS | Stops, routes, trips, stop times | Transit accessibility, service frequency, network coverage | Scheduled service is not always actual service |
| OSM | Streets, paths, nodes, tags | Routing, network structure, walk/bike access | Completeness varies by place and feature type |
| Travel surveys | People, households, trips | Mode choice, trip purpose, travel behavior | Small samples and recall/reporting bias |
| Sensor/GPS data | Devices, vehicles, traces, counts | Flows, speeds, volumes, activity patterns | Sample bias, privacy |
]
