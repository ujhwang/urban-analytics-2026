## Where we left off

.small[
Last session we installed everything, met R Markdown and RPubs, and learned the basics of R: operators, data types, vectors, indexing, and reading/saving data.

Today is the part you will actually use every week:
]

.pull-left[
.small[
* **`dplyr`** -- the verbs that do most data work
* **Piping** -- chaining those verbs together
* **Recoding** -- `if_else()` and `case_when()`
* **Joining** -- combining two data frames side-by-side
]
]

.pull-right[
.small[
* **Missing values** -- `NA` and how it spreads
* **`ggplot2`** -- making a chart
* **Custom functions** -- stop copy-pasting yourself
]
]

.content-box-yellow[
Most of today operates on `df_tract`: Census Tract demographics for four metro Atlanta counties.
]

## dplyr basics

#### select, filter, arrange, mutate, slice, group_by + summarise

All verbs work similarly: &lt;font size=2px, color='grey'&gt;(Wickham &amp; Grolemund (2016))&lt;/font&gt;

* The first argument of the verbs is a data frame.
* The subsequent arguments describe what to do with the data frame
* The result is a new data frame.

--

e.g., `filter()` keeps observations (i.e., rows of a DF) that match a condition.


```r
filter(df_tract, # specifies which data.frame
       county == "DeKalb County") # conditional statement
```
which is equivalent to

```r
df_tract[df_tract$county == "DeKalb County", ]
```

---
## Piping


```r
df_tract %&gt;%
  filter(county == "DeKalb County") %&gt;%
  filter(hhincome &gt; 100000) %&gt;%
  head(3) %&gt;%
  print()
```

```
## # A tibble: 3 × 8
##         GEOID tract          county state hhincome pop_total pop_white pop_black
##         &lt;dbl&gt; &lt;chr&gt;          &lt;chr&gt;  &lt;chr&gt;    &lt;dbl&gt;     &lt;dbl&gt;     &lt;dbl&gt;     &lt;dbl&gt;

```

which is equivalent to


```r
print(head(filter(filter(df_tract, county == 'DeKalb County'), hhincome &gt; 100000), 3))
```

---
## Piping


```r
df_tract %&gt;%
  filter(county == "DeKalb County") %&gt;%
  filter(hhincome &gt; 100000) %&gt;%
  head(3) %&gt;%
  print()
```

.center[
%&gt;% (or |&gt;) is called the **pipe**:
An operator that takes the output of one function and
passes it as **the first argument** to the following function.
]

.footnotesize[
You will see two pipes in the wild. `%&gt;%` comes from the `magrittr` package and is loaded with the tidyverse. `|&gt;` is built into R itself (4.1+). They do the same thing here. **We use `%&gt;%` in this course** because a few tidyverse idioms later in the semester depend on it.
]

## dplyr basics

**mutate()**: creates new columns using existing columns. It can also modify (if the name is the same as an existing column)

```r
df_tract %&gt;%
* mutate(pct_white = pop_white / pop_total) %&gt;%
  select(2:4, pop_total, pop_white, pct_white) %&gt;% nice_table()

## Recoding: if_else

**if_else()** picks between two values based on a condition. It is how you turn a continuous variable into a category.


```r
df_tract %&gt;%
* mutate(income_group = if_else(hhincome &gt;= 65000,
*                               "Higher income",
*                               "Lower income")) %&gt;%
  count(income_group)
```

```
## # A tibble: 3 × 2
##   income_group      n
##   &lt;chr&gt;         &lt;int&gt;
## 1 Higher income   219
## 2 Lower income    295
## 3 &lt;NA&gt;              5
```

.footnotesize[
The three arguments are `if_else(condition, value_if_true, value_if_false)`. Note the `NA` group -- 5 tracts have no income value, and a missing input gives a missing output. More on that shortly.
]

---
## Recoding: case_when

When you need **more than two** categories, `if_else()` nests badly. **case_when()** is the readable version.

.footnotesize[

```r
df_tract %&gt;%
  mutate(income_tier = case_when(
    hhincome &lt;   40000 ~ "Under $40k",
    hhincome &lt;   75000 ~ "$40k-$75k",
    hhincome &lt;  120000 ~ "$75k-$120k",
    hhincome &gt;= 120000 ~ "$120k and up",
    .default = "Unknown"
  )) %&gt;%
  count(income_tier)
```

```
## # A tibble: 5 × 2
##   income_tier      n
##   &lt;chr&gt;        &lt;int&gt;
## 1 $120k and up    44
## 2 $40k-$75k      227
## 3 $75k-$120k     115
## 4 Under $40k     128
## 5 Unknown          5
```
]

.content-box-yellow[
.footnotesize[
**Order matters.** `case_when()` stops at the first match, top to bottom. That is why `hhincome &lt; 75000` does not also need `&gt;= 40000`.
]
]

---
## if / else

`if` runs a block of code only when a condition is `TRUE`. `else` catches everything else.


```r
x &lt;- 42000

if (x &gt; 65000) {
  print("Higher income")
} else if (x &gt; 40000) {
  print("Middle income")
} else {
  print("Lower income")
}
```

```
## [1] "Middle income"
```

.content-box-red[
.small[
**`if` is not `if_else()`.** `if` takes a **single** TRUE/FALSE and decides which code runs. `if_else()` works down a whole **column** and returns a vector. Inside `mutate()` you almost always want `if_else()` or `case_when()`.
]
]

## The join family

.small[
| Function | Keeps |
|---|---|
| `left_join(A, B)` | Keeps all rows from A |
| `right_join(A, B)` | Keeps all rows from B |
| `inner_join(A, B)` | Keeps only rows that have a match in both |
| `full_join(A, B)` | Keeps all rows from both |
| `anti_join(A, B)` | Keeps only rows from A with **no** match in B |
]
  
  
.content-box-blue[
.small[
**anti_join() is your debugging tool.** Before trusting a join, use it to ask "what failed to match?"
]
]

## Stacking vs. joining

A **join** adds *columns* by matching a key. **`bind_rows()`** adds *rows* -- use it when two tables have the same columns.


```r
cobb &lt;- df_tract %&gt;% filter(county == "Cobb County")

##  NAs and NaNs
NaN stands for **Not a Number.** This results from numerical operation that returns undefined results. Try `0/0` in your console.

NA stands for **Not available**, meaning a missing value.


```r
df_tract %&gt;%
  select(hhincome, pop_total, pop_white, pop_black) %&gt;%
  summary()
```

```
##     hhincome        pop_total       pop_white         pop_black      
##  Min.   :  9815   Min.   :    0   Min.   :    0.0   Min.   :    0.0  
##  1st Qu.: 40153   1st Qu.: 3586   1st Qu.:  469.5   1st Qu.:  638.5  
##  Median : 58418   Median : 4939   Median : 2026.0   Median : 1622.0  
##  Mean   : 66750   Mean   : 5317   Mean   : 2319.6   Mean   : 2374.3  
##  3rd Qu.: 84288   3rd Qu.: 6570   3rd Qu.: 3641.0   3rd Qu.: 3333.5  
##  Max.   :200179   Max.   :18039   Max.   :12255.0   Max.   :16759.0  
##  NA's   :5
```

Notice that **hhincome** has 5 missing values (NAs). &lt;br&gt; three other columns have at least one zero.

---
## Why NA spreads

`NA` is contagious on purpose: the average of a set of numbers where one is unknown is itself unknown.


```r
mean(c(1, 2, NA))
```

```
## [1] NA
```

Two ways out -- remove the missing values from the calculation, or remove the rows:


```r
mean(c(1, 2, NA), na.rm = TRUE)
```

```
## [1] 1.5
```

.content-box-red[
.small[
`na.rm = TRUE` does not make the problem go away, it makes a decision about it. You are now averaging a different set of tracts than you think you are. Know how many you dropped.
]
]

---
## Dropping NaN and NA
We need to filter out zeros from `pop_total` and NAs from `hhincome`.

The highlighted part is saying, "pick rows for which `pop_total` is greater than 0 **AND** `hhincome` is not NA."

df_tract %&gt;%
* filter(pop_total &gt; 0 &amp; !is.na(hhincome)) %&gt;%
  mutate(pct_white = pop_white / pop_total) %&gt;%
  group_by(county) %&gt;%

# Plotting with ggplot2

---
## The grammar of graphics

`ggplot2` builds a chart out of three things:

.small[
1. **Data** -- the data frame
2. **Aesthetics** -- which column maps to which visual property (x, y, color, size)
3. **Geometry** -- what marks to draw (points, bars, lines, polygons)
]


```r
ggplot(data = &lt;DATA&gt;, mapping = aes(&lt;MAPPINGS&gt;)) +
  &lt;GEOM_FUNCTION&gt;()
```

.content-box-red[
.small[
**Why `+` and not `%&gt;%`?** `ggplot2` predates the pipe. You are not chaining data through functions here -- you are **adding layers onto a plot object**. Different operation, different operator. It is a wart, but a permanent one.
]
]

---

# Custom Function

---
## Function
.small[
* We have learned functions provided by R as built-in functions or by someone else as a package.
  * sum(); dplyr::filter()
* Now we will learn how to define our own functions.

```r
functionName &lt;- function(argument){
  something &lt;- doSomething(argument)
  what_i_need &lt;- doAnotherThing(something)
  return(what_i_need)
}
```
* Why custom functions?
  * Code reusability and maintainability
  &gt; Rule of Three: If you're copying and pasting a block of code more than two times, it might be worth creating a function
  * Cleaner environment: function scope vs. global scope
]

---
## Function example
.small[
.pull-left[
* without a function

```r
summary1 &lt;- df1 %&gt;%
  filter(a &gt; 100) %&gt;%
  group_by(b) %&gt;%
  summarize(c = sum(c),
            d = sum(d)) %&gt;%
  mutate(e = round(c/d, 2))

summary2 &lt;- df2 %&gt;%
  filter(a &gt; 100) %&gt;%
  group_by(b) %&gt;%
  summarize(c = sum(c),
            d = sum(d)) %&gt;%
  mutate(e = round(c/d, 2))

summary3 &lt;- df3 %&gt;%
  filter(a &gt; 100) %&gt;%
  group_by(b) %&gt;%
  summarize(c = sum(c),
            d = sum(d)) %&gt;%
  mutate(e = round(c/d, 2))
```
]
.pull-right[
* with a function

```r
createSummary &lt;- function(df){
  summary &lt;- df %&gt;%
    filter(a &gt; 100) %&gt;%
    group_by(b) %&gt;%
    summarize(c = sum(c),
              d = sum(d)) %&gt;%
    mutate(e = round(c/d, 2))
  return(summary)
}

summary1 &lt;- createSummary(df1)
summary2 &lt;- createSummary(df2)
summary3 &lt;- createSummary(df3)
```
]
]
---
## Function example
.small[
.pull-left[
* without a function

```r
summary1 &lt;- df1 %&gt;%
* filter(co_lumn &gt; 100) %&gt;%
  group_by(b) %&gt;%
  summarize(c = sum(c),
            d = sum(d)) %&gt;%
  mutate(e = round(c/d, 2))

summary2 &lt;- df2 %&gt;%
* filter(col_umn &gt; 100) %&gt;%
  group_by(b) %&gt;%
  summarize(c = sum(c),
            d = sum(d)) %&gt;%
  mutate(e = round(c/d, 2))
```
]
.pull-right[
* with a function

```r
createSummary &lt;- function(df, col){
  summary &lt;- df %&gt;%
*   filter(.data[[col]] &gt; 100) %&gt;%
    group_by(b) %&gt;%
    summarize(c = sum(c),
              d = sum(d)) %&gt;%
    mutate(e = round(c/d, 2))
  return(summary)
}

summary1 &lt;- createSummary(df1, 'co_lumn')
summary2 &lt;- createSummary(df2, 'col_umn')
```
]
]

.footnotesize[
.content-box-yellow[
**Why the quotation marks?** Inside `filter()`, a bare `col` would mean "*the column literally named col*", which does not exist. `.data[[col]]` says "*look up the column whose **name** is the string held in `col`*"
]
.content-box-yellow[
`.data` is a **pronoun** standing for "the data frame currently being worked on". It comes from `rlang`, which `dplyr` re-exports -- so `library(tidyverse)` is all you need.
]
]

## Create a function: Fahrenheit to Celsius
.content-box-green[
***Write a function that converts a given temperature from Fahrenheit to Celsius using the following formula.*** &lt;br&gt;
`\(C = (F-32)*5/9\)`
]


--


```r
fahrenheitToCelsius &lt;- function(f){
  c &lt;- (f - 32) * 5/9
  return(c)
}

fahrenheitToCelsius(92)

## Arguments and defaults

An argument can be given a **default**, which makes it optional when you call the function.


```r
pct &lt;- function(x, digits = 1){
  paste0(round(x * 100, digits), "%")
}

pct(0.4315853)             # uses the default
```

```
## [1] "43.2%"
```

```r
pct(0.4315853, digits = 3) # override it
```

```
## [1] "43.159%"
```

.small[
Arguments are matched by **position** first, then by **name**. Naming them is clearer:
]


```r
pct(0.4315853, 3)              # works, but what is 3?
pct(x = 0.4315853, digits = 3) # unambiguous
```

## Practice: guarding against bad input

.content-box-green[
***Write*** `share(part, whole, digits = 1)` ***that returns*** `part / whole` ***as a percentage string like*** `"29.2%"` ***-- but returns*** `NA` ***when*** `whole` ***is 0, instead of*** `Inf` ***or*** `NaN`***.***

***Test:*** `share(1442, 4939)` ***and*** `share(5, 0)`
]

.footnotesize[
*hint: an `if` at the top of the function, and `return()` to exit early.
]

--

.small[

```r
share &lt;- function(part, whole, digits = 1){
  if (whole == 0){
    return(NA)
  } else {
    return(paste0(round(part / whole * 100, digits), "%")  )
  }
}

share(1442, 4939)
```

```
## [1] "29.2%"
```

```r
share(5, 0)
```

```
## [1] NA
```
]

## Create a function: Timestamp Day Converter
***Create your own function that tells which day the given Unix time is.*** &lt;br&gt;&lt;br&gt;

Unix time &lt;font size="-1"&gt;(a.k.a Unix epoch, Unix timestamp, or POSIX time)&lt;/font&gt; is the number of seconds that have elapsed since **midnight 01/01/1970 (Thursday)**. Assume that the time zone of the function user is GMT/UTC+0 (in other words, do not worry about the time zone).

* Test your function:
&gt; Which day is Unix time **1788134400**?

.footnotesize[
*hint: modulus (`%%`) and integer division (`%/%`) will be useful.
]

---
## Timestamp Day Converter: one solution



```r
getDayFromTimestamp &lt;- function(t){
  d &lt;- 60*60*24
  
  day_index &lt;- t %/% d %% 7
  
  days &lt;- c('Thurs','Fri','Satur','Sun','Mon','Tues','Wednes')
  
  paste0('Unix Timestamp ', t, ' is ', days[day_index + 1], 'day')
}

getDayFromTimestamp(1788134400)
```

```
## [1] "Unix Timestamp 1788134400 is Monday"
```


---
## In practice, let a package do it

Worth doing by hand once, so you know what a timestamp actually *is*. In real work, use `lubridate`:


```r
library(lubridate)
as_datetime(1788134400)
```

```
## [1] "2026-08-31 UTC"
```

```r
wday(as_datetime(1788134400), label = TRUE)
```

```
## [1] Mon
## Levels: Sun &lt; Mon &lt; Tue &lt; Wed &lt; Thu &lt; Fri &lt; Sat
```

.content-box-blue[
.small[
That is the general lesson: understand the mechanism, then use the tool.
]
