# Setting up your Google API key

.font100[
Uijeong "UJ" Hwang

CP8883 Introduction to Urban Analytics
]



---
## What you will do

Seven steps. You need a Google account and a credit card.

.footnotesize[
1. Create a project in the Google Cloud Console
2. Copy your API key
3. Restrict the key to the two APIs we use
4. Add a billing account
5. Enable **Places API (New)** and **Street View Static API**
6. Cap your usage with a quota
7. Set budget alerts
]

--

.content-box-red[
.footnotesize[
Google asks for a credit card even though we stay inside the free allowances.

**Every account gets 5,000 free Nearby Search calls per month** and it resets monthly.

New accounts *also* get a one-time **$300 credit for 90 days**.
]
]

---
## Step 1 -- Create a project

.footnotesize[
1. Search *"google developers console"*, or go straight to [console.cloud.google.com](https://console.cloud.google.com/)
2. Log in with your Google account. If asked, choose a country and click **Agree and continue**
3. Click the project dropdown at the top, then **New project**
]

.pull-left[
&lt;img src="img/api_key/01_cloud_hub.png" width="100%" /&gt;

&lt;img src="img/api_key/02_select_project.png" width="100%" /&gt;
]
.pull-right[
&lt;img src="img/api_key/03_new_project.png" width="85%" /&gt;
]

---
## Step 2 -- Your API key appears

.footnotesize[
Once the project is created, the key is shown right away. You do not need to do anything with it yet -- you can always find it again under **APIs &amp; Services** -&gt; **Credentials**.
]

.center[
&lt;img src="img/api_key/04_api_key_shown.png" width="58%" /&gt;
]

.content-box-red[
**NEVER EXPOSE THIS KEY.** Your credit card is linked to it. Do not paste it into a script, a notebook, or anything you publish.
]

---
## Step 3 -- Restrict the key

.footnotesize[
A restricted key only works for the APIs you pick, so a leak is bounded. Go to **APIs &amp; Services** -&gt; **Credentials**, open your key, and under **API restrictions** check **Places API (New)** and **Street View Static API**.
]

.pull-left[
&lt;img src="img/api_key/06_nav_credentials.png" width="68%" /&gt;
]
.pull-right[
&lt;img src="img/api_key/05_restrict_api.png" width="100%" /&gt;
]

---
## Step 4 -- Add a billing account

.footnotesize[
1. Open the navigation menu (top-left) and click **Billing**
2. Click **ADD BILLING ACCOUNT**
]

.pull-left[
.center[
&lt;img src="img/api_key/07_nav_billing.png" width="55%" /&gt;
]
]
.pull-right[
&lt;img src="img/api_key/08_billing_accounts.png" width="100%" /&gt;
]

---
## Step 4 -- Complete the signup

.footnotesize[
Fill out both steps. Step 2 asks for a card to verify who you are; you are **not** charged unless you turn on automatic billing.
]

&lt;img src="img/api_key/09_signup_step1.png" width="100%" /&gt;

---
## Step 4 -- Complete the signup

.footnotesize[
Fill out both steps. Step 2 asks for a card to verify who you are; you are **not** charged unless you turn on automatic billing.
]

&lt;img src="img/api_key/10_signup_step2.png" width="100%" /&gt;


---
## Step 5 -- Enable the two APIs

.footnotesize[
1. Navigation menu -&gt; **APIs &amp; Services** -&gt; **Library**
2. Search *"places api"*, click **Places API (New)**, then click **Enable**
3. Do the same for **Street View Static API**
]

.pull-left[
&lt;img src="img/api_key/11_nav_library.png" width="100%" /&gt;
]

---
## Step 5 -- Enable the two APIs

.footnotesize[
1. Navigation menu -&gt; **APIs &amp; Services** -&gt; **Library**
2. Search *"places api"*, click **Places API (New)**, then click **Enable**
3. Do the same for **Street View Static API**
]

.pull-left[
&lt;img src="img/api_key/12_places_search.png" width="100%" /&gt;
]
.pull-right[
&lt;img src="img/api_key/13_places_enable.png" width="100%" /&gt;
]

---
## Step 6 -- Cap your usage with a quota

Go to **APIs &amp; Services** -&gt; **Quotas**, find **Places API**, and set the requests-per-day limit to a few hundred.

.footnotesize[
That is far above what this course needs and far below anything expensive. When your project hits the quota, the API simply stops responding.
]

--

.content-box-green[
This is the control that actually **stops** a runaway loop or a leaked key. A budget alert does not -- it only emails you, and billing data lags behind real usage.
]

---
## Step 7 -- Set budget alerts

.footnotesize[
Go to **Billing** -&gt; **Budgets &amp; alerts** and create a budget. Threshold rules email you as spending climbs.

The screenshot uses **$3 / $150 / $270** against a $300 budget, which only makes sense if you have the new-account trial credit.
]

.content-box-yellow[
.footnotesize[
**No trial credit? Set the budget to $1.** You should never be billed at all, so treat any charge as a smoke alarm rather than a budget.
]
]

.pull-left[
&lt;img src="img/api_key/14_create_budget.png" width="100%" /&gt;
]
.pull-right[
&lt;img src="img/api_key/15_budget_thresholds.png" width="72%" /&gt;
]

---
## You are done when

.content-box-green[
* You have an API key, **restricted** to Places API (New) and Street View Static API
* A billing account is attached to the project
* Both APIs show as **Enabled**
* A budget with email alerts exists
]

--

Next, store the key in your `.Renviron` as `GOOGLE_API_KEY`:

.small[

```r
usethis::edit_r_environ()   # add:  GOOGLE_API_KEY=your_key_here
```
]

.content-box-red[
Never paste the key into a script, a notebook, or anything you publish.
]
