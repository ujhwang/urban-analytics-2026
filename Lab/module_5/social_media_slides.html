## What Qualifies as “Social Media”?

Social media is digital technology that allows the sharing of ideas, information, events, and experiences through text and visuals within virtual networks and communities.

--

It typically features user-generated content that engages a wider audience through likes, shares, comments, and discussions.

--

Types of social media:

- Social networks

--

- Media sharing networks

--

- Discussion forums/communities

--

- Microblogging

--

- Messaging

--

- Professional/business networks
---

## Types of Social Media Data

- **Textual data:** User posts, comments, and replies as sources of sentiment and discussion.

--

- **Interaction data:** Likes, upvotes, replies, and shares as indicators of engagement and popularity.

--

- **User metadata:** Post timing and location, when available. Profile details are not verified demographics.
---
## Is Social Media Useful?

### Five Characteristics of Big Data

Which of the five makes social media useful? Which makes it difficult to use?

--

- **Volume:** The amount of data being generated

--

- **Velocity:** The speed at which data is generated

--

- **Variety:** The different types of data (structured, semi-structured, or unstructured)

--

- **Veracity:** The trustworthiness of the data

--

- **Value:** What we can learn from the data

## Social Media Analysis

- **Data collection:** APIs and web scraping, where access and platform rules allow

--

- **Text preprocessing/normalization:** Tokenization, stop-word removal, stemming, and lemmatization

--

- **Sentiment analysis:** Rule-based models and deep learning models

--

- **Topic modeling:** For example, Latent Dirichlet Allocation (LDA)

---
## From Posts to Results

“The bus was late again. I waited 30 minutes.”

| Step | What we do with this post |
|---|---|
| **1. Collect** | Find posts about bus service in our study period. |
| **2. Prepare** | Split the text into words and remove common words such as “the.” |
| **3. Analyze** | Count words such as “late” and “waited,” or estimate sentiment. |
| **4. Interpret** | Read similar posts to understand what riders describe. |

One complaint gives us an example. A collection of posts helps us look for patterns.


---
## Negative Sentiment ≠ Opposition

&gt; “The bus is unreliable. We need more transit funding.”

.pull-left[
### How does the writer feel?
Frustrated with the current service.

**Sentiment:** negative
]
.pull-right[
### What does the writer support?
Spending more on transit.

**Position:** supports more funding
]

&lt;div style="clear:both"&gt;&lt;/div&gt;

Before interpreting a sentiment score, ask: **negative about what?**

## Tokenization

Tokenization separates a piece of text into smaller units called **tokens**.

Three types of tokenization:

- **Word:** Machine Learning → “Machine” / “Learning”
- **Character:** Machine Learning → “M” / “a” / “c” / “h” / “i” / “n” / …
- **Subword:** tokenization → “token” / “ization” (RoBERTa tokenizer)

---
## Stop Words

Stop words are common words, such as “the” and “a,” that we often remove when counting words.

&lt;img src="assets/original_pptx/image12.png" class="example-image" alt="Example of removing common stop words from text"&gt;

.small[For sentiment analysis, keep words such as **“not”**: “not good” and “good” mean different things.]

.citation[Source: [Computer Hope](https://www.computerhope.com/jargon/s/stopword.htm).]

## Stemming &amp; Lemmatization

.small[
- **Stemming** uses rules to shorten words, often by removing suffixes. The result may not be a dictionary word.
- **Lemmatization** reduces a word to its dictionary form using vocabulary and grammatical information.
]

&lt;img src="assets/original_pptx/image13.jpeg" style="display:block;width:100%;height:365px;object-fit:contain" alt="Comparison of stemming and lemmatization"&gt;


.citation[Source: [SEO Depths](https://seodepths.com/seo-research/nlp-seo-guide-use-cases/).]

---
## Stemming &amp; Lemmatization: Examples

Try: **cats, flies, best, happily**. Results depend on the method and part of speech.

| Word | Stemming (Porter) | Lemmatization (spaCy) |
|---|---|---|
| cats | cat | cat |
| flies | fli | fly |
| **best** | **best** | **good** |
| happily | happili | happily |

In **“the best route,”** “best” is an adjective: good → better → best.

“Happily” stays an adverb; it does not become “happy.”

.citation[spaCy’s [English rule-based lemmatizer](https://spacy.io/api/lemmatizer), with parts of speech supplied: noun, verb, adjective, adverb.]

## Sentiment Analysis: Rule-based model

Dictionary-based models use words with assigned sentiment values (positive, negative, or neutral).

They score text by matching its words to the dictionary.

### Limitations
- **Context:** “That’s sick”
- **Nuance:** “I liked the food” vs. “I kind of liked the food”
- **Negation:** “The bus is reliable” vs. “The bus is not reliable”


---
## Sentiment Analysis: Deep learning model

Deep learning models learn patterns from data. Transformers use surrounding words to represent context.

Like we did in the Computer Vision module, we will use a pretrained model to estimate sentiment in YouTube comments.

Try: **“Great, another canceled train.”**

Run the model on your computer using the [sentiment demo notebook](https://colab.research.google.com/drive/16_evF7XyWil0gfZrsUm0cLQrCxiKi9LY?usp=sharing). No paid inference service is needed.

## Topic Modeling: What Are People Talking About?

A topic model finds groups of words that tend to appear together across posts.

| Words that appear together | A name we might give the topic |
|---|---|
| late · wait · schedule | Reliability |
| fare · cost · pass | Fares |
| ramp · elevator · stairs | Accessibility |

The model finds word patterns. **We read the posts and name the topics.**

A post can discuss more than one topic—for example, a late bus with a broken ramp.

## YouTube Data API

&gt; This course previously used Reddit for this module’s lab. Reddit’s data-access rules have changed, making it harder for us to collect posts. We are switching to YouTube, which provides an API for collecting public comments.

The YouTube Data API lets us request public information from YouTube directly in R.

- Choose videos about a topic.
- Download comments and information about those videos.
- Turn the results into an analyzable format.

.citation[[YouTube Data API overview](https://developers.google.com/youtube/v3/getting-started)]

---
## YouTube API: Getting Started

Use the same **Google Cloud Console** we used for Google Maps.

1. Select your Google Cloud project.
2. Enable **YouTube Data API v3**.
3. Restrict your API key to **YouTube Data API v3**.

.citation[[Setup and authentication](https://developers.google.com/youtube/v3/guides/authentication)]

---
## YouTube API: What Can We Get?

| Data | Examples |
|---|---|
| **Videos** | Title, description, channel, publication date |
| **Video statistics** | View count, like count, comment count (when available) |
| **Comments** | Text, publication date, like count, comment ID |
| **Comment threads** | Top-level comment, reply count, and some replies |

For the lab, **one row will be one top-level comment**, linked to its video.

.citation[Getting every reply requires additional requests. [Videos](https://developers.google.com/youtube/v3/docs/videos) · [Comments](https://developers.google.com/youtube/v3/docs/comments) · [Threads](https://developers.google.com/youtube/v3/docs/commentThreads)]

---
## YouTube API: How It Works

&lt;img src="assets/youtube-api-flow.svg" style="width:100%;height:210px" alt="R sends a video ID, API key, and request options to the YouTube API. YouTube returns a page of comments, which R converts to table rows."&gt;

1. Copy a video URL from YouTube and extract its **video ID**.
2. Request up to **100 top-level comments** using `commentThreads.list`.
3. If the response includes a `nextPageToken`, use it to request the next page.
4. Combine the pages and save the data.

.citation[[Comment collection and pagination](https://developers.google.com/youtube/v3/docs/commentThreads/list)]

---
## YouTube API: How Much Can We Collect?

**10,000 quota units per project per day** for comments and most other requests. The quota resets at midnight Pacific Time.

One comment-page request costs **1 unit**, for up to **100 top-level comments**.

| Comments | Requests, if every page is full | Quota units |
|---|---:|---:|
| 1,000 | 10 | 10 |
| 5,000 | 50 | 50 |
| 10,000 | 100 | 100 |

.small[Extra requests for replies or video details also use quota.]

.citation[[Quota costs](https://developers.google.com/youtube/v3/determine_quota_cost) · [Comment requests](https://developers.google.com/youtube/v3/docs/commentThreads/list)]

## YouTube Comments: What Will We Do?

Choose a video about a place, project, or policy, and ask a question about its comments.

- Compare common words and phrases using word clouds and n-grams.
- Estimate sentiment and read sample comments to check the scores.
- Compare sentiment across videos on the same topic that present different perspectives or tones.

---
## YouTube Comments: Example Questions

**[New study reveals dramatic racial shift in historic Atlanta neighborhood](https://www.youtube.com/watch?v=YLFREO2qW5Y)** — 11Alive

## Test Your YouTube API Key

After completing the setup in Google Cloud Console, run this code to confirm that your API key works.

```r
library(httr2)
library(tidyverse)

video_id &lt;- "tycWtaejktA" # from https://www.youtube.com/watch?v=tycWtaejktA

response &lt;- request("https://www.googleapis.com/youtube/v3/commentThreads") %&gt;%
  req_url_query(
    part = "snippet",
    videoId = video_id,
    maxResults = 100,
    order = "time",
    textFormat = "plainText",
    key = Sys.getenv("GOOGLE_API_KEY") # You may need to change this
  ) %&gt;%
  req_perform() %&gt;%
  resp_body_json()

if (length(response$items) &gt; 0) print(response$items[[1]]$snippet$topLevelComment$snippet$textDisplay)
```
