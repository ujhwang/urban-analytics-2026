# What is Urban Analytics?

[Urban analytics defined](https://journals.sagepub.com/doi/full/10.1177/2399808319839494)

--

* Application of &lt;b&gt;Big data&lt;/b&gt; and &lt;b&gt;data science tools&lt;/b&gt; to understand, monitor, and control urban functions and processes

--

* Michael Goodchild defines it as a 'new kind of urban research, one that exploits the vast new sources that are becoming available from &lt;b&gt;social media, crowd sourcing, and sensor networks&lt;/b&gt;...'

--

* 'Urban analytics is fast emerging as the core set of tools employed to deal with problems of &lt;b&gt;big data, urban simulation, and geodemographics&lt;/b&gt;' -- Michael Batty

--

* Analytics is the &lt;b&gt;discovery, interpretation, and communication of meaningful patterns in data&lt;/b&gt;' --Wikipedia

Original research on an urban question **of your choosing**, using the data and methods we cover in class.

**Forming groups** -- you form your own, **up to three people**. Do it early.

### Three presentations

.sm[
| | When | What | Graded |
|:--|:--|:--|:--|
| 1 | Mid-Oct | Idea + related literature/examples | No |
| 2 | Mid-Nov | Data, methods, preliminary results | No |
| 3 | Early Dec | Final project | **Yes** |
]

.notebox[

The first two are for feedback -- from me and from the class -- while there is still time to change direction. Only the final presentation is graded, along with the report.
]
]

# Using AI in This Course

**You may use AI assistants.** They are part of how this work gets done now, and pretending otherwise would not help you.

The rule is one sentence:

.okbox[
### Use them in a way that **helps** your learning, not in a way that **skips** it.
]

.sm[
Asking an AI to *explain* an error, a function, or a concept helps you. Handing in code you have not read does not -- and it leaves you unable to debug it, defend it, or build on it.
]

---
# Using AI: Two Penalties

.sm[
Two things carry a penalty. Both are about **blind** use.
]

.penaltybox[
.sm[
**1. Turning in AI output you have not digested.**
Where it is obvious the code was pasted in without being read, understood, or adapted to the question actually asked.

.deduction[&amp;minus;50% per occurrence]
]
]

.penaltybox[
.sm[
**2. Taking an unnecessarily complicated detour** when a simple approach we covered in class would do the job -- and giving no reason for it.

.deduction[&amp;minus;25% per occurrence]
]
]

.sm[
If you have a *reason* for the more complicated route, say so in your script. A sentence is enough. This penalty is for detours with no rationale, not for ambition.
]

---
# Quizzes After Assignments

**Some** assignments -- mini or major -- are followed by a short quiz in the next session.

* Simple, direct questions about the assignment you just submitted.
* Anyone who genuinely did the work will find them easy.
* Scored **0 to 1**, applied as a **multiplier on that assignment's grade**.
* **You get one wrong answer for free.** Beyond that, the multiplier scales proportionally.

.notebox[
.sm[
No quiz means no multiplier -- that assignment's score stands on its own. The quiz is not extra points; it checks that what you handed in is work you understand.
]
]

### If you miss a quiz

.sm[
* **Mini** &amp;rarr; that becomes your dropped assignment. Nothing to do.
* **Major** &amp;rarr; join that week's office hour for a short oral make-up.
]

# How to Succeed in This Class

.small[
1. **Expect some frustration.** It is part of learning to program. But don't spin your wheels -- you are responsible for actively looking for help, and for not leaving things to the last minute.

2. **Replicate, don't just read.** Run the examples, reproduce the results, and repeat until it makes sense.

3. **Work with peers.** Talk through problems and let their sharp eyes catch your bugs -- but type your own code. Passing code for assignments between students is not collaboration.

4. **Google it.** Almost every problem you hit this semester, someone has hit and solved already. Troubleshooting on your own is a skill that outlasts this course.

5. **Ask me.** Anytime, in class or out. Office hours are another learning opportunity, not a last resort.
]
